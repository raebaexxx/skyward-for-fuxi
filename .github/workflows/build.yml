name: Build fuxi

# Every push is linted and tested, and the recovery is built on the Android
# 17 base kept in this repository's `base` release. A tag beginning
# `fuxi-v` publishes the zip as a release. Run by hand for the image alone.
on:
  push:
    branches: ["**"]
    tags: ["fuxi-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  # Shown as the build's author on the Specs page.
  SKYWARD_BUILDER: RaeBaeXXX
  # The Android 17 recovery of crDroid 17.0 for fuxi, kept in the base release.
  BASE: fuxi-a17-recovery.img
  BASE_SHA256: 3fb4d898eaafaeb01d11e6fffdc59f1437b9760231512d899783fd0f0b3bed1a

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Lint what runs on the computer
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      - name: Lint what runs on the phone
        run: cargo ndk -t arm64-v8a --platform 30 clippy --locked -p skyward -p skyward-install -p skyward-systems -p skyward-system-init -- -D warnings

  tools:
    name: Build the recovery service and the packer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build the recovery service for the phone
        run: |
          # The build is the release it is made for, so that Skyward's own
          # update check compares like with like: a tag fuxi-v1.5 makes a
          # build that says 1.5.
          if [ "$GITHUB_REF_TYPE" = tag ]; then export SKYWARD_VERSION="${GITHUB_REF_NAME#fuxi-v}"; fi
          cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward
      # It runs as a second system's first program, before any library is
      # there to load.
      - name: Build the second system's first program, static
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward-system-init --target-dir target/system-init
      - name: Build the packer
        run: cargo build --locked --release -p skyward-pack
      - name: Gather them
        run: |
          mkdir tools
          cp target/aarch64-linux-android/release/skyward target/release/skyward-pack tools/
          cp target/system-init/aarch64-linux-android/release/system-init tools/
      - uses: actions/upload-artifact@v7
        with:
          name: tools
          path: tools/
          if-no-files-found: error
          retention-days: 1

  recovery:
    name: Build the recovery image
    needs: [tools]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: tools
          path: tools
      - name: Make the tools runnable
        run: chmod +x tools/skyward tools/skyward-pack
      - name: Take the Android 17 base out of the base release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p stock
          gh release download base --pattern "$BASE" --dir stock
          echo "$BASE_SHA256  stock/$BASE" | sha256sum --check
      - name: Pack the recovery
        id: pack
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="${GITHUB_REF_NAME#fuxi-}"; else version="${GITHUB_SHA::7}"; fi
          name="skyward-fuxi-$version"
          mkdir out
          tools/skyward-pack recovery --stock "stock/$BASE" --binary tools/skyward --system-init tools/system-init \
            --config devices/fuxi.toml --font resources/fonts/MiSansVF.ttf --mono resources/fonts/KirkMono-Regular.ttf \
            --mono-license resources/fonts/KirkMono-OFL.txt --out "out/$name.img"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      # The image is the whole partition, flashed as it is, and most of it
      # is the room the recovery leaves empty; it is handed out zipped.
      - name: Zip the image
        working-directory: out
        env:
          NAME: ${{ steps.pack.outputs.name }}
        run: zip -9 "$NAME.zip" "$NAME.img"
      - uses: actions/upload-artifact@v7
        with:
          path: out/${{ steps.pack.outputs.name }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the release
    if: github.ref_type == 'tag'
    needs: [check, recovery]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: skyward-*
          path: images
          merge-multiple: true
          skip-decompress: true
      - name: Sum the zip
        working-directory: images
        run: sha256sum -- *.zip > SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          name=$(basename images/*.zip .zip)
          cat > notes.md <<NOTES
          # Skyward for fuxi · Xiaomi 13

          Version 1.9.4 makes Format data finish. 1.9.3 had corrected the key
          handling, but the filesystem tool refused a partition that already
          held one, and discarding every block first could stall the storage.
          The recovery now makes the filesystem over what is there and throws
          the old key away; the system makes a new key at its next start. Do
          not use Format data in 1.9.2: asking the key service for a key could
          take the phone down.

          While data cannot be opened, a piece of the phone's memory stands in
          for internal storage, so a package can still be brought in over the
          network or from a computer and flashed. A restart empties it; it
          stands in only where the partition truly holds nothing.

          Android 17 data decryption with the screen lock, verified on crDroid
          17.0 up to 1.9.3. The phone's own partitions name its programs and
          keys, and fuxi keeps its WLAN vendor directory, VNDK fallback and
          English/Russian pages.

          ## Flash

          \`\`\`
          adb reboot bootloader
          fastboot flash recovery ${name}.img
          fastboot reboot recovery
          \`\`\`

          The image is built on the Android 17 recovery kept in this
          repository's \`base\` release. Back up your current recovery first if
          you want to return to it.
          NOTES
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber --repo "$GITHUB_REPOSITORY" "images/${name}.zip" images/SHA256SUMS.txt
          else
            gh release create "$GITHUB_REF_NAME" --title "Skyward for fuxi · $GITHUB_REF_NAME" \
              --notes-file notes.md "images/${name}.zip#Xiaomi 13 (fuxi)" images/SHA256SUMS.txt
          fi
