[device]
codename = "fuxi"
brand = "Xiaomi"
model = "Xiaomi 13"
ab = true
soc = { hans = "第二代骁龙®8移动平台", hant = "Snapdragon® 8 Gen 2 行動平台", en = "Snapdragon® 8 Gen 2 Mobile Platform" }
os_version_prop = "ro.mi.os.version.incremental"

[display]
# persist.sys.miui_resolution in the odm partition's build.prop.
width = 1080
height = 2400
density = 420

[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor"]
# The touchscreen: ST FTS over SPI, the one touch driver the phone's own
# modules.load lists, as on the 13 Ultra.
load = ["fts_touch_spi"]

# The touchscreen's nodes are handed to the system user by the phone's own
# init scripts, which the recovery reads as it brings them up. crDroid's FTS
# driver reports touches through the input device it registers itself, so
# none of MIUI's touch processing nodes are needed here.

# Each of the phone's own programs below runs as the user, in the groups
# and with the capabilities its init script on the phone gives it.

# What the phone's own init runs once the system has finished starting, as
# kernel-post-boot in /vendor/etc/init/hw/init.qti.kernel.rc. The kernel
# starts the CPU clusters on the performance governor, which holds them at
# their highest clock; the script hands them to WALT, lets idle CPUs power
# down and sets how the memory bus scales. Without it the CPUs stay at
# their highest clock and voltage even while idle, and the phone slowly
# heats up. It runs before the touch programs, which need none of it.
[[service]]
path = "/vendor/bin/sh"
args = ["/vendor/bin/init.kernel.post_boot.sh"]
libraries = ["/system/lib64", "/vendor/lib64"]
oneshot = true
user = "root"
groups = ["root", "system", "wakelock", "graphics"]

# The panel's touches are reported by fts_touch_spi.ko itself, through the
# input device it registers, so a recovery reads them from /dev/input without
# MIUI's touch_report and touchsensor: those programs are not in a crDroid
# build of this phone, and starting one that is not there would stop the
# recovery from bringing up anything else.

# WLAN: the same converged node in the device tree as the 13 Ultra's, which
# names no one chip. The phone's own modules.load lists qca_cld3_kiwi,
# qca_cld3_kiwi_v2 and qca_cld3_qca6490 and blocks none of them; the 13
# Ultra's WCN7850 is driven by qca_cld3_kiwi_v2, and so is this phone's
# taken to be. Its recovery covers the vendor partition's firmware folder
# with the modem's, as the 13 Ultra's does, so the settings and the MAC
# address are given to the loader again: the settings from the vendor
# partition, the address from where the vendor's link points in persist.
[wlan]
modules = ["qca_cld3_kiwi_v2"]
writes = [{ path = "/sys/kernel/cnss/fs_ready", value = "1" }]
firmware = [
    { name = "wlan/qca_cld/kiwi_v2/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/kiwi_v2/WCNSS_qcom_cfg.ini" },
    { name = "wlan/qca_cld/kiwi_v2/wlan_mac.bin", partition = "persist", path = "kiwi_v2/wlan_mac.bin" },
]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/vendor/lib64", "/system/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

# The update server the stock updater of the Chinese system asks.
[update]
server = "https://update.miui.com/updates/miotaV3.php"

# The stock build upstream's configuration names for this phone. It is an
# Android 16 build: this fork's images are made on the Android 17 recovery
# of crDroid 17.0 instead, because its vendor binaries are built against
# Android 17's libc++, which an Android 16 recovery ramdisk cannot load.
[stock]
version = "OS3.0.309.0.WMCCNXM"
package = "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.309.0.WMCCNXM/fuxi-ota_full-OS3.0.309.0.WMCCNXM-user-16.0-4729900895.zip"
recovery = "f3749538243783db7393c3bc4cb72bb4ca6a046e0ceb3a6c779bf6fc4eef610e"

# qcom-hv-haptics, as on the 13 Ultra, whose driver plays the click it
# keeps as waveform 0 and says the motor's resonant frequency in
# lra_frequency_hz; the strengths are the 13 Ultra's.
[haptics]
click = 0
resonance = "/sys/class/qcom-haptics/lra_frequency_hz"
strength = { lightest = 0.5, strongest = 1.0 }

# The secure stack that opens the data partition on a crDroid 17 build of
# this phone: qseecomd, the key service, the older services' directory, the
# credential service and the boot control. The vendor is the Android 16
# Qualcomm one, so the key service is AIDL and the credential service is
# HIDL 1.0, as on the 13 Pro.

# The installed system_ext lies in /system_ext on a recovery ramdisk that
# carries that folder and in /mnt/system_ext on one that does not. A link
# of the first name to the second lets the service paths below be the same
# on both.
[[service]]
path = "/system/bin/sh"
args = ["-c", "test -e /mnt/system_ext || ln -s /system_ext /mnt/system_ext"]
oneshot = true
user = "root"
groups = ["root"]

# The secure world reaches back into Android through the listeners this
# daemon registers; without them the key service cannot use any key.
[[service]]
path = "/vendor/bin/qseecomd"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_property = "vendor.sys.listeners.registered"
user = "root"
groups = ["root", "drmrpc"]

# The key service, the only thing that can use keys the phone wrapped in
# hardware. Decryption of the data partition needs it.
[[service]]
path = "/vendor/bin/hw/android.hardware.security.keymint-service-qti"
libraries = ["/system/lib64", "/vendor/lib64", "/mnt/system/system/lib64", "/mnt/system/system/lib64/bootstrap"]
ready_service = "android.hardware.security.keymint.IKeyMintDevice/default"
user = "system"
groups = ["system", "drmrpc"]

# The directory the older HIDL services register with. A recovery carries
# none of it, so this is the installed system's own program against the
# installed system's libraries; it reports ready by the property those
# services wait on. The link above makes /mnt/system_ext reach the installed
# system_ext whichever folder the recovery mounts it in.
[[service]]
path = "/mnt/system_ext/bin/hwservicemanager"
libraries = ["/mnt/system/system/lib64/bootstrap", "/mnt/system/system/lib64", "/mnt/system_ext/lib64", "/system_ext/lib64"]
ready_property = "hwservicemanager.ready"
user = "system"
groups = ["system", "readproc"]

# The credential service: the secure world has it check a screen lock, and
# it is the only thing that can hand out the note the key service wants
# before using a key a screen lock guards.
[[service]]
path = "/vendor/bin/hw/android.hardware.gatekeeper@1.0-service-qti"
libraries = ["/system/lib64", "/vendor/lib64", "/mnt/system/system/lib64", "/mnt/system/system/lib64/bootstrap"]
ready_hardware_service = "android.hardware.gatekeeper@1.0::IGatekeeper/default"
user = "system"
groups = ["system"]

# The boot control, which says which slot the bootloader starts next and
# switches it. It comes last: the phone is usable without it. crDroid's is
# the newer kind, and the vendor's own program serves it.
[[service]]
path = "/vendor/bin/hw/android.hardware.boot-service.qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_service = "android.hardware.boot.IBootControl/default"
user = "root"
groups = ["root"]

# The secure world's applets, among them the keymaster and gatekeeper ones,
# are on the modem partition, which the phone's own boot mounts at
# /vendor/firmware_mnt. A recovery does not, and without them qseecomd starts
# but the key service cannot load what it asks the secure world for.
[firmware]
partition = "modem"

# The partitions a baseband/EFS backup takes, and what of the data partition
# a backup leaves out because the secure world keeps it in step with itself.
[backup]
efs = ["modemst1", "modemst2", "fsg", "fsc", "persist"]
data_skipped = ["vendor/tzstorage", "vendor/qtee", "vendor/goodix", "vendor/fingerprint", "vendor/fpdata", "vendor/misc/mi_fp"]

# Where the phone's own programs keep logs in the data partition.
[wipe]
logs = [
    "/data/vendor/diag",
    "/data/vendor/bsplog",
    "/data/vendor/log",
    "/data/vendor/ramdump",
    "/data/vendor/ssrdump",
    "/data/vendor/tombstones",
    "/data/vendor/wlan_logs",
]
